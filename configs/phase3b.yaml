model: <Qwen/Qwen3-VL-4B-Instruct>
init_from: <path/to/phase3a/checkpoint-XXX>
train_jsonl: <path/to/phase3b/train.jsonl>
output_dir: <path/to/phase3b/output>

reward_target_tags:
  - <tag>
  - <tag-2>

target_models:  
  <tag>:
    provider: openai
    model: <model-id>
    tag: <tag>
    temperature: <float>
    top_p: <float>
    max_output_tokens: <int>
    reasoning_effort: <minimal|low|medium|high>
    reasoning_summary: <auto|concise|detailed>
    timeout: <float seconds>
    max_retries: <int>

  <tag-2>:
    provider: anthropic
    model: <model-id>
    tag: <tag-2>
    temperature: <float>
    top_p: <float>
    top_k: <int>
    max_output_tokens: <int>
    thinking: <enabled|disabled>
    thinking_budget_tokens: <int>
    timeout: <float seconds>
    max_retries: <int>

  <tag-3>:
    provider: gemini
    model: <model-id>
    tag: <tag-3>
    temperature: <float>
    top_p: <float>
    top_k: <int>
    max_output_tokens: <int>
    thinking_budget: <int>
    timeout: <float seconds>
    max_retries: <int>

grpo_args:  
  num_generations: 
  max_completion_length: 
  temperature:
  beta: 
  epsilon:
  learning_rate:
  max_steps:
  per_device_train_batch_size: 
  gradient_accumulation_steps:
  bf16: 
  gradient_checkpointing:
  seed: 
  save_strategy: 
  save_steps:
  report_to:
  log_completions:
  use_vllm: 
  push_to_hub: 
  logging_steps:
  logging_first_step:

input_csv: <path/to/input.csv>

models:
  - provider: openai
    model: <model-id>
    tag: <tag>
    temperature: <float>
    top_p: <float>
    max_output_tokens: <int>
    reasoning_effort: <minimal|low|medium|high>
    reasoning_summary: <auto|concise|detailed>
    timeout: <float seconds>
    max_retries: <int>

  - provider: anthropic
    model: <model-id>
    tag: <tag>
    temperature: <float>
    top_p: <float>
    top_k: <int>
    max_output_tokens: <int>
    thinking: <enabled|disabled>
    thinking_budget_tokens: <int>
    timeout: <float seconds>
    max_retries: <int>

  - provider: gemini
    model: <model-id>
    tag: <tag>
    temperature: <float>
    top_p: <float>
    top_k: <int>
    max_output_tokens: <int>
    thinking_budget: <int>
    timeout: <float seconds>
    max_retries: <int>
